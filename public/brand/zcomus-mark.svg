<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zcomus">
  <title>Zcomus</title>
  <!-- handle: thin arc, reads as a bag grip rather than a padlock shackle -->
  <path d="M24 26v-6a8 8 0 0 1 16 0v6" fill="none" stroke="#A6704D" stroke-width="2.6" stroke-linecap="round"/>
  <!-- bag body: trapezoid, wider at the base -->
  <path d="M16.5 26h31l2.4 29.6a2.8 2.8 0 0 1-2.8 3.04H16.9a2.8 2.8 0 0 1-2.8-3.04z" fill="#A6704D"/>
  <!-- Z knockout -->
  <path d="M25 33h14v4.2l-7.6 7.6H39V49H25v-4.2l7.6-7.6H25z" fill="#F9F7F2"/>
  <!-- growth arrow, light tan so the Z stays legible underneath -->
  <path d="M19 50.5l6.5-6.5 4.6 3.4 9.4-11.4" fill="none" stroke="#EFD8C0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43.6 32.2l-.8 8.3-7.4-5.9z" fill="#EFD8C0"/>
</svg>
