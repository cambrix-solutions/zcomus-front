name: Build & deploy frontend

on:
  push:
    branches: [production]
  workflow_dispatch:

# Never let two deploys race each other onto the same server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # devDependencies are required: @quasar/app-vite, vite, vue-tsc and
      # eslint all run during the build. Never use --omit=dev here.
      - name: Install dependencies
        run: npm ci

      # vite-plugin-checker runs vue-tsc + eslint as part of build,
      # so a type or lint error fails the deploy before anything ships.
      - name: Build PWA
        run: npx quasar build -m pwa

      - name: Verify build output
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/sw.js
          test -f dist/pwa/manifest.json
          echo "Build size: $(du -sh dist/pwa | cut -f1)"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # No pinned host key provided: trust on first use.
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Compute release name
        run: echo "RELEASE=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/$RELEASE'"
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            dist/pwa/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/releases/$RELEASE/"

      # Symlink swap via `mv -T` is atomic, so nginx never sees a partial site.
      - name: Activate release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          KEEP_RELEASES: '5'
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'

          # nginx runs as the 'www' user on aaPanel; ignore if not permitted.
          chown -R www:www 'releases/$RELEASE' 2>/dev/null || true
          find 'releases/$RELEASE' -type d -exec chmod 755 {} + 2>/dev/null || true
          find 'releases/$RELEASE' -type f -exec chmod 644 {} + 2>/dev/null || true

          # Atomic swap. 'mv -T' needs GNU coreutils; the fallback also recovers
          # if 'current' was left behind as a real directory instead of a symlink.
          ln -sfn 'releases/$RELEASE' current.tmp
          if ! mv -Tf current.tmp current 2>/dev/null; then
            rm -rf current
            mv current.tmp current
          fi

          # Keep the newest N releases so a rollback target always exists.
          # Sort by NAME, not mtime: names are UTC timestamps, so ordering is
          # deterministic even when deploys land in the same second. The active
          # release is skipped explicitly so a prune can never delete live files.
          ACTIVE=\$(readlink current || true)
          ls -1d releases/*/ 2>/dev/null | sed 's:/*\$::' | sort -r \\
            | tail -n +\$(( $KEEP_RELEASES + 1 )) \\
            | while read -r old; do
                [ "\$old" = "\$ACTIVE" ] && continue
                rm -rf "\$old"
              done

          test -f current/index.html || { echo 'FATAL: current/index.html missing'; exit 1; }
          echo "Active release: \$(readlink current)"
          EOF

      - name: Summary
        run: |
          echo "### Deployed \`$RELEASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
