name: Build & deploy frontend

on:
  push:
    branches: [production]
  workflow_dispatch:

# Never let two deploys race each other onto the same server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # devDependencies are required: @quasar/app-vite, vite, vue-tsc and
      # eslint all run during the build. Never use --omit=dev here.
      - name: Install dependencies
        run: npm ci

      # vite-plugin-checker runs vue-tsc + eslint as part of build, so a type
      # or lint error fails the deploy before anything reaches the server.
      - name: Build PWA
        run: npx quasar build -m pwa

      - name: Verify build output
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/sw.js
          test -f dist/pwa/manifest.json
          grep -q 'return`production`' dist/pwa/assets/index-*.js \
            || { echo "FATAL: bundle is not in production API mode (check .env.prod)"; exit 1; }
          echo "Build size: $(du -sh dist/pwa | cut -f1)"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts
          # Fingerprints are not secret. Printing it makes an SSH_KEY mismatch
          # obvious: compare against `ssh-keygen -lf` of the server's public key.
          ssh-keygen -lf ~/.ssh/id_deploy \
            || { echo "FATAL: SSH_KEY is not a valid private key (check for lost newlines)"; exit 1; }

      # Writes directly into the folder nginx already serves
      # (root /www/wwwroot/zcomus-front/dist/pwa). No server config is touched.
      #   --delay-updates : stage new files, then rename them in at the end
      #   --delete-after  : remove stale files only once the transfer succeeded
      # Together these keep the swap-over window as short as rsync allows.
      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # BatchMode stops ssh falling back to a password prompt, which would
          # otherwise bury the real "publickey rejected" cause in retry noise.
          SSH_OPTS="-i $HOME/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes"
          SSH_OPTS="$SSH_OPTS -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          TARGET="$DEPLOY_PATH/dist/pwa"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET'"

          rsync -az --delete --delay-updates --delete-after \
            -e "ssh $SSH_OPTS" \
            dist/pwa/ "$SSH_USER@$SSH_HOST:$TARGET/"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "test -f '$TARGET/index.html' && test -f '$TARGET/sw.js' && echo 'Deploy verified on server'"

      - name: Summary
        run: |
          echo "### Deployed \`${GITHUB_SHA::7}\` to dist/pwa" >> "$GITHUB_STEP_SUMMARY"
